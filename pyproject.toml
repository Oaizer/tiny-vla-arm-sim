[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyvla-arm"
version = "0.2.0"
description = "Train and test a small vision and language policy on a simulated arm"
requires-python = ">=3.11,<3.12"
dependencies = ["torch==2.14.1+cpu", "numpy==2.4.6", "pybullet==3.2.7", "pillow==12.3.0", "imageio==2.38.0", "imageio-ffmpeg==0.6.0"]

[project.scripts]
tinyvla = "tinyvla.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tinyvla = ["floor.png"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv]
constraint-dependencies = ["filelock==3.32.3", "fsspec==2026.7.0", "jinja2==3.1.6", "markupsafe==3.0.3", "mpmath==1.3.0", "networkx==3.6.1", "setuptools==78.1.0", "sympy==1.14.0", "typing-extensions==4.16.0"]
